<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1150" width="100%" height="100%" style="background-color: #ffffff; font-family: Arial, Helvetica, sans-serif;">
  <defs>
    <!-- Arrowhead markers -->
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#000000" />
    </marker>
    <marker id="arrow-dashed" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#000000" />
    </marker>
    <style>
      .title-box { fill: #ffffff; stroke: #000000; stroke-width: 1.5; }
      .title-text { font-size: 14px; font-weight: bold; text-anchor: middle; dominant-baseline: middle; fill: #000000; }
      .swimlane-header { font-size: 13px; font-weight: bold; text-anchor: middle; fill: #000000; }
      .swimlane-line { stroke: #000000; stroke-width: 1.5; }
      .action-node { fill: #ffffff; stroke: #000000; stroke-width: 1.2; rx: 8px; ry: 8px; }
      .action-text { font-size: 11px; text-anchor: middle; dominant-baseline: middle; fill: #000000; }
      .decision-node { fill: #ffffff; stroke: #000000; stroke-width: 1.2; }
      .flow-line { fill: none; stroke: #000000; stroke-width: 1.2; marker-end: url(#arrow); }
      .dashed-line { fill: none; stroke: #000000; stroke-width: 1.2; stroke-dasharray: 4,4; marker-end: url(#arrow-dashed); }
      .label-text { font-size: 10px; fill: #000000; text-anchor: middle; }
    </style>
  </defs>

  <!-- Outer Boundary Frame -->
  <rect x="20" y="20" width="960" height="1110" fill="none" stroke="#000000" stroke-width="1.5" />

  <!-- Title Banner Box -->
  <rect x="20" y="20" width="960" height="35" class="title-box" />
  <text x="500" y="37" class="title-text">Activity Diagram - AI Text Detector</text>

  <!-- Swimlane Dividers -->
  <!-- Header line -->
  <line x1="20" y1="80" x2="980" y2="80" class="swimlane-line" />
  
  <!-- Vertical Swimlane Lines -->
  <!-- Col 1: User (20 to 260) -->
  <!-- Col 2: System (260 to 500) -->
  <!-- Col 3: Detection Engine (500 to 740) -->
  <!-- Col 4: Database (740 to 980) -->
  <line x1="260" y1="55" x2="260" y2="1130" class="swimlane-line" />
  <line x1="500" y1="55" x2="500" y2="1130" class="swimlane-line" />
  <line x1="740" y1="55" x2="740" y2="1130" class="swimlane-line" />

  <!-- Swimlane Header Labels -->
  <text x="140" y="70" class="swimlane-header">User</text>
  <text x="380" y="70" class="swimlane-header">System</text>
  <text x="620" y="70" class="swimlane-header">Detection Engine</text>
  <text x="860" y="70" class="swimlane-header">Database</text>

  <!-- ==================== SWIMLANE 1: USER ==================== -->
  <!-- Initial Node (Start Circle) -->
  <circle cx="140" cy="110" r="12" fill="#000000" stroke="#000000" stroke-width="1" />
  
  <!-- Flow: Start -> Open Detector Dashboard -->
  <path d="M 140 122 L 140 145" class="flow-line" />

  <!-- Open Detector Dashboard -->
  <rect x="75" y="145" width="130" height="40" class="action-node" />
  <text x="140" y="159" class="action-text">Open Detector</text>
  <text x="140" y="173" class="action-text">Dashboard</text>

  <!-- Flow: Open Detector Dashboard -> Enter Target Text / Upload File -->
  <path d="M 140 185 L 140 210" class="flow-line" />

  <!-- Enter Target Text / Upload File -->
  <rect x="65" y="210" width="150" height="40" class="action-node" />
  <text x="140" y="224" class="action-text">Enter Target Text /</text>
  <text x="140" y="238" class="action-text">Upload File</text>

  <!-- Flow: Enter Target Text -> Validate Input (System) -->
  <path d="M 215 230 L 320 230" class="flow-line" />

  <!-- Error Message -->
  <rect x="75" y="280" width="130" height="40" class="action-node" />
  <text x="140" y="300" class="action-text">Error Message</text>

  <!-- Flow: Error Message -> Enter Target Text -->
  <path d="M 140 280 L 140 250" class="flow-line" />

  <!-- View Scan Report -->
  <rect x="75" y="930" width="130" height="40" class="action-node" />
  <text x="140" y="950" class="action-text">View Scan Report</text>

  <!-- Flow: View Scan Report -> Download Report -->
  <path d="M 140 970 L 140 995" class="flow-line" />

  <!-- Download Report (PDF / JSON) -->
  <rect x="65" y="995" width="150" height="40" class="action-node" />
  <text x="140" y="1009" class="action-text">Download Report</text>
  <text x="140" y="1023" class="action-text">(PDF / JSON)</text>

  <!-- Flow: Download Report -> Final Node -->
  <path d="M 140 1035 L 140 1065" class="flow-line" />

  <!-- Final Node (Concentric Circles) -->
  <circle cx="140" cy="1080" r="14" fill="none" stroke="#000000" stroke-width="1.5" />
  <circle cx="140" cy="1080" r="8" fill="#000000" stroke="#000000" stroke-width="1" />

  <!-- ==================== SWIMLANE 2: SYSTEM ==================== -->
  <!-- Validate Input -->
  <rect x="320" y="210" width="120" height="40" class="action-node" />
  <text x="380" y="230" class="action-text">Validate Input</text>

  <!-- Flow: Validate Input -> Decision Node -->
  <path d="M 380 250 L 380 275" class="flow-line" />

  <!-- Decision: Is Input Valid? -->
  <polygon points="380,275 425,300 380,325 335,300" class="decision-node" />
  <text x="380" y="295" class="action-text" style="font-size: 10px;">Is Input</text>
  <text x="380" y="307" class="action-text" style="font-size: 10px;">Valid?</text>

  <!-- Flow: Is Input Valid? -> No -> Error Message -->
  <path d="M 335 300 L 205 300" class="flow-line" />
  <text x="270" y="292" class="label-text">No</text>

  <!-- Flow: Is Input Valid? -> Yes -> Create Scan Task -->
  <path d="M 380 325 L 380 355" class="flow-line" />
  <text x="390" y="340" class="label-text">Yes</text>

  <!-- Create Scan Task -->
  <rect x="320" y="355" width="120" height="40" class="action-node" />
  <text x="380" y="369" class="action-text">Create Scan</text>
  <text x="380" y="383" class="action-text">Task</text>

  <!-- Flow: Create Scan Task -> Store Scan Details -->
  <path d="M 380 395 L 380 425" class="flow-line" />

  <!-- Store Scan Details -->
  <rect x="320" y="425" width="120" height="40" class="action-node" />
  <text x="380" y="439" class="action-text">Store Scan</text>
  <text x="380" y="453" class="action-text">Details</text>

  <!-- Dashed Flow: Store Scan Details -> Store Scan Task (Database) -->
  <path d="M 440 445 L 795 445" class="dashed-line" />

  <!-- Flow: Store Scan Details -> Start Classification Process -->
  <path d="M 380 465 L 380 495" class="flow-line" />

  <!-- Start Classification Process -->
  <rect x="315" y="495" width="130" height="40" class="action-node" />
  <text x="380" y="509" class="action-text">Start Classification</text>
  <text x="380" y="523" class="action-text">Process</text>

  <!-- Flow: Start Classification Process -> Preprocessing & Extraction (Engine) -->
  <path d="M 445 515 L 545 515" class="flow-line" />

  <!-- Generate Report Summary -->
  <rect x="315" y="855" width="130" height="40" class="action-node" />
  <text x="380" y="869" class="action-text">Generate Report</text>
  <text x="380" y="883" class="action-text">Summary</text>

  <!-- Flow: Generate Report Summary -> Present Result to User -->
  <path d="M 380 895 L 380 930" class="flow-line" />

  <!-- Present Result to User -->
  <rect x="315" y="930" width="130" height="40" class="action-node" />
  <text x="380" y="944" class="action-text">Present Result</text>
  <text x="380" y="958" class="action-text">to User</text>

  <!-- Flow: Present Result to User -> View Scan Report (User) -->
  <path d="M 315 950 L 205 950" class="flow-line" />

  <!-- ==================== SWIMLANE 3: DETECTION ENGINE ==================== -->
  <!-- Preprocessing & Extraction -->
  <rect x="545" y="495" width="150" height="40" class="action-node" />
  <text x="620" y="509" class="action-text">Preprocessing &amp;</text>
  <text x="620" y="523" class="action-text">Extraction</text>

  <!-- Split Branch Lines to 4 sub-classifiers -->
  <path d="M 620 535 L 620 550" stroke="#000000" stroke-width="1.2" fill="none" />
  <path d="M 527 550 L 712 550" stroke="#000000" stroke-width="1.2" fill="none" />
  
  <path d="M 527 550 L 527 570" class="flow-line" />
  <path d="M 589 550 L 589 570" class="flow-line" />
  <path d="M 651 550 L 651 570" class="flow-line" />
  <path d="M 712 550 L 712 570" class="flow-line" />

  <!-- 4 Sub-classifiers -->
  <!-- 1. Perplexity Engine -->
  <rect x="503" y="570" width="48" height="45" class="action-node" />
  <text x="527" y="587" class="action-text" style="font-size: 8px;">Perplexity</text>
  <text x="527" y="598" class="action-text" style="font-size: 8px;">Engine</text>

  <!-- 2. KNN Classifier -->
  <rect x="565" y="570" width="48" height="45" class="action-node" />
  <text x="589" y="587" class="action-text" style="font-size: 8px;">KNN</text>
  <text x="589" y="598" class="action-text" style="font-size: 8px;">Classifier</text>

  <!-- 3. Logistic Regression -->
  <rect x="627" y="570" width="48" height="45" class="action-node" />
  <text x="651" y="587" class="action-text" style="font-size: 8px;">Logistic</text>
  <text x="651" y="598" class="action-text" style="font-size: 8px;">Regression</text>

  <!-- 4. POS & Trigram -->
  <rect x="688" y="570" width="48" height="45" class="action-node" />
  <text x="712" y="587" class="action-text" style="font-size: 8px;">POS &amp;</text>
  <text x="712" y="598" class="action-text" style="font-size: 8px;">Trigram</text>

  <!-- Join Branch Lines from 4 sub-classifiers -->
  <path d="M 527 615 L 527 635" stroke="#000000" stroke-width="1.2" fill="none" />
  <path d="M 589 615 L 589 635" stroke="#000000" stroke-width="1.2" fill="none" />
  <path d="M 651 615 L 651 635" stroke="#000000" stroke-width="1.2" fill="none" />
  <path d="M 712 615 L 712 635" stroke="#000000" stroke-width="1.2" fill="none" />

  <path d="M 527 635 L 712 635" stroke="#000000" stroke-width="1.2" fill="none" />
  <path d="M 620 635 L 620 655" class="flow-line" />

  <!-- Compute Weighted Ensemble Score -->
  <rect x="545" y="655" width="150" height="40" class="action-node" />
  <text x="620" y="669" class="action-text">Compute Weighted</text>
  <text x="620" y="683" class="action-text">Ensemble Score</text>

  <!-- Flow: Compute Weighted Ensemble Score -> Save Scan Results -->
  <path d="M 620 695 L 620 735" class="flow-line" />

  <!-- Save Scan Results -->
  <rect x="555" y="735" width="130" height="40" class="action-node" />
  <text x="620" y="755" class="action-text">Save Scan Results</text>

  <!-- Dashed Flow: Save Scan Results -> Store Scan Results (Database) -->
  <path d="M 685 755 L 795 755" class="dashed-line" />

  <!-- ==================== SWIMLANE 4: DATABASE ==================== -->
  <!-- Store Scan Task -->
  <rect x="795" y="425" width="130" height="40" class="action-node" />
  <text x="860" y="439" class="action-text">Store Scan</text>
  <text x="860" y="453" class="action-text">Task</text>

  <!-- Store Scan Results -->
  <rect x="795" y="735" width="130" height="40" class="action-node" />
  <text x="860" y="749" class="action-text">Store Scan</text>
  <text x="860" y="763" class="action-text">Results</text>

  <!-- Flow: Store Scan Results -> Retrieve Data for Report -->
  <path d="M 860 775 L 860 805" class="flow-line" />

  <!-- Retrieve Data for Report -->
  <rect x="795" y="805" width="130" height="40" class="action-node" />
  <text x="860" y="819" class="action-text">Retrieve Data</text>
  <text x="860" y="833" class="action-text">for Report</text>

  <!-- Dashed Flow: Retrieve Data for Report -> Generate Report Summary (System) -->
  <path d="M 795 825 L 445 875" class="dashed-line" />

</svg>
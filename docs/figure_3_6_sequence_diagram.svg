<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 900" width="1000" height="900" style="background-color: #ffffff;">
  <defs>
    <!-- Arrowhead Markers -->
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#333333" />
    </marker>
    <marker id="arrow-open" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9" fill="none" stroke="#333333" stroke-width="1.8" />
    </marker>
  </defs>

  <style>
    .header-text { font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif; font-size: 16px; font-weight: bold; text-anchor: middle; }
    .lifeline { stroke-width: 2; fill: none; }
    .activation-server { fill: #dae8fc; stroke: #6c8ebf; stroke-width: 1.5; rx: 3; }
    .activation-engine { fill: #f8cecc; stroke: #b85450; stroke-width: 1.5; rx: 3; }
    .msg-line { stroke: #333333; stroke-width: 1.8; stroke-dasharray: 6,4; fill: none; }
    .msg-line-solid { stroke: #333333; stroke-width: 1.8; fill: none; }
    .msg-text { font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif; font-size: 13.5px; font-weight: 500; fill: #222222; text-anchor: middle; }
    .num-circle { fill: #ffffff; stroke: #555555; stroke-width: 1.5; }
    .num-text { font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif; font-size: 12px; font-weight: bold; fill: #333333; text-anchor: middle; dominant-baseline: central; }
    .loop-box { fill: #fff2cc; fill-opacity: 0.2; stroke: #d6b656; stroke-width: 1.8; rx: 6; }
    .loop-tab { fill: #e1d5e7; stroke: #9673a6; stroke-width: 1.5; rx: 3; }
    .loop-title { font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif; font-size: 12px; font-weight: bold; fill: #4c0099; }
    .loop-cond { font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif; font-size: 13px; font-weight: bold; fill: #333333; }
    .caption-title { font-family: 'Times New Roman', Times, serif; font-size: 20px; font-weight: bold; text-anchor: middle; fill: #000000; }
  </style>

  <!-- Title Caption -->
  <text x="500" y="32" class="caption-title">Figure 3.6: Sequence Diagram for AI Text Detector</text>

  <!-- Lifeline Vertical Lines -->
  <!-- Client (X=150) -->
  <line x1="150" y1="105" x2="150" y2="840" class="lifeline" stroke="#888888" />
  <!-- Server (X=380) -->
  <line x1="380" y1="105" x2="380" y2="840" class="lifeline" stroke="#6c8ebf" />
  <!-- Scanner Engine (X=620) -->
  <line x1="620" y1="105" x2="620" y2="840" class="lifeline" stroke="#b85450" />
  <!-- Database (X=850) -->
  <line x1="850" y1="105" x2="850" y2="840" class="lifeline" stroke="#82b366" />

  <!-- Activation Bars -->
  <!-- Server Bar -->
  <rect x="371" y="150" width="18" height="660" class="activation-server" />
  <!-- Scanner Engine Bar -->
  <rect x="611" y="215" width="18" height="520" class="activation-engine" />

  <!-- Participant Headers (Draw.io Fills) -->
  <!-- 1. Client Header (Grey) -->
  <rect x="75" y="50" width="150" height="55" rx="10" ry="10" fill="#606060" stroke="#404040" stroke-width="2" />
  <text x="150" y="83" class="header-text" fill="#ffffff">Client</text>

  <!-- 2. Server Header (Soft Blue) -->
  <rect x="305" y="50" width="150" height="55" rx="10" ry="10" fill="#dae8fc" stroke="#6c8ebf" stroke-width="2" />
  <text x="380" y="83" class="header-text" fill="#000000">Server</text>

  <!-- 3. Scanner Engine Header (Soft Pink/Red) -->
  <rect x="545" y="50" width="150" height="55" rx="10" ry="10" fill="#f8cecc" stroke="#b85450" stroke-width="2" />
  <text x="620" y="83" class="header-text" fill="#000000">Scanner Engine</text>

  <!-- 4. Database Header (Soft Mint Green) -->
  <rect x="775" y="50" width="150" height="55" rx="10" ry="10" fill="#d5e8d4" stroke="#82b366" stroke-width="2" />
  <text x="850" y="83" class="header-text" fill="#000000">Database</text>

  <!-- MESSAGE FLOW PIPELINE -->

  <!-- Step 1: Client -> Server (Scan request) -->
  <path d="M 150 165 L 369 165" class="msg-line" marker-end="url(#arrow-open)" />
  <text x="260" y="157" class="msg-text">Scan request</text>
  <circle cx="150" cy="165" r="11" class="num-circle" />
  <text x="150" y="165" class="num-text">1</text>

  <!-- Step 2: Server -> Scanner Engine (Initiate scan) -->
  <path d="M 389 230 L 609 230" class="msg-line" marker-end="url(#arrow-open)" />
  <text x="500" y="222" class="msg-text">Initiate scan</text>
  <circle cx="389" cy="230" r="11" class="num-circle" />
  <text x="389" y="230" class="num-text">2</text>

  <!-- Step 3: Scanner Engine <-> Database (payloads / feature models) -->
  <path d="M 629 295 L 848 295" class="msg-line" marker-end="url(#arrow-open)" />
  <text x="740" y="287" class="msg-text">payloads / models</text>
  <circle cx="629" cy="295" r="11" class="num-circle" />
  <text x="629" y="295" class="num-text">3</text>

  <!-- Loop Fragment Box -->
  <g transform="translate(340, 345)">
    <rect x="0" y="0" width="460" height="190" class="loop-box" />
    <!-- Loop Badge Tab -->
    <rect x="0" y="0" width="55" height="24" class="loop-tab" />
    <text x="27" y="15" class="loop-title" text-anchor="middle">loop</text>
    <text x="65" y="17" class="loop-cond">Scan all endpoints / AI evaluation engines</text>
  </g>

  <!-- Step 4: Self-call on Scanner Engine (Test for Perplexity, KNN, Cosine, etc.) -->
  <path d="M 629 400 L 685 400 L 685 435 L 631 435" class="msg-line-solid" marker-end="url(#arrow-open)" />
  <text x="760" y="412" class="msg-text" text-anchor="start">Test Perplexity, KNN,</text>
  <text x="760" y="428" class="msg-text" text-anchor="start">Cosine, POS, Trigram, etc.</text>
  <circle cx="629" cy="400" r="11" class="num-circle" />
  <text x="629" y="400" class="num-text">4</text>

  <!-- Step 5: Scanner Engine -> Server (Return scores) -->
  <path d="M 611 490 L 391 490" class="msg-line" marker-end="url(#arrow-open)" />
  <text x="500" y="482" class="msg-text">Return</text>
  <circle cx="611" cy="490" r="11" class="num-circle" />
  <text x="611" y="490" class="num-text">5</text>

  <!-- Step 6: Scanner Engine -> Database (Store results) -->
  <path d="M 629 570 L 848 570" class="msg-line" marker-end="url(#arrow-open)" />
  <text x="740" y="562" class="msg-text">Store results</text>
  <circle cx="629" cy="570" r="11" class="num-circle" />
  <text x="629" y="570" class="num-text">6</text>

  <!-- Step 7: Server -> Scanner Engine (Request report) -->
  <path d="M 389 640 L 609 640" class="msg-line" marker-end="url(#arrow-open)" />
  <text x="500" y="632" class="msg-text">Request report</text>
  <circle cx="389" cy="640" r="11" class="num-circle" />
  <text x="389" y="640" class="num-text">7</text>

  <!-- Step 8: Scanner Engine -> Server (Send report) -->
  <path d="M 611 710 L 391 710" class="msg-line" marker-end="url(#arrow-open)" />
  <text x="500" y="702" class="msg-text">Send report</text>
  <circle cx="611" cy="710" r="11" class="num-circle" />
  <text x="611" y="710" class="num-text">8</text>

  <!-- Step 9: Server -> Client (Return report) -->
  <path d="M 371 780 L 152 780" class="msg-line" marker-end="url(#arrow-open)" />
  <text x="260" y="772" class="msg-text">Return report</text>
  <circle cx="371" cy="780" r="11" class="num-circle" />
  <text x="371" y="780" class="num-text">9</text>

</svg>
    <text x="25" y="72" font-family="sans-serif" font-size="11px" fill="#000000">do_GET(): void</text>
    <text x="12" y="88" font-family="sans-serif" font-size="11px" font-weight="bold" fill="#888888">+</text>
    <text x="25" y="88" font-family="sans-serif" font-size="11px" fill="#000000">do_POST(): void</text>
    <text x="12" y="104" font-family="sans-serif" font-size="11px" font-weight="bold" fill="#888888">+</text>
    <text x="25" y="104" font-family="sans-serif" font-size="11px" fill="#000000">do_DELETE(): void</text>
  </g>

  <!-- ==================== RELATIONSHIPS ==================== -->


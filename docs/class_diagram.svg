<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1360 980" width="100%" height="100%">
  <defs>
    <!-- Classic open blue arrowhead marker for dependencies -->
    <marker id="arrow-classic" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 1 1 L 9 5 L 1 9" fill="none" stroke="#0055d4" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
    </marker>
    
    <!-- Generalization (Inheritance) triangle marker -->
    <marker id="arrow-inheritance" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 1 1 L 9 5 L 1 9 Z" fill="#ffffff" stroke="#333333" stroke-width="1.5" />
    </marker>
  </defs>

  <!-- Plain White Background -->
  <rect width="100%" height="100%" fill="#ffffff" />

  <!-- Diagram Title -->
  <g transform="translate(60, 45)">
    <text font-family="sans-serif" font-size="22px" font-weight="bold" fill="#000000">SENTINEL AI TEXT DETECTOR</text>
    <text y="22" font-family="sans-serif" font-size="12px" fill="#555555">UML Class Diagram - Static Architecture, Generalization, and Dependencies</text>
  </g>

  <!-- ==================== CLASSES (UML BOXES) ==================== -->

  <!-- 1. FileParser Class -->
  <g transform="translate(60, 110)">
    <rect x="0" y="0" width="280" height="110" fill="#ffffff" stroke="#333333" stroke-width="1.5" />
    <rect x="0" y="0" width="280" height="35" fill="#f3f3f3" stroke="#333333" stroke-width="1.5" />
    <text x="140" y="22" text-anchor="middle" font-family="sans-serif" font-weight="bold" font-size="12px" fill="#000000">FileParser</text>
    <line x1="0" y1="35" x2="280" y2="35" stroke="#333333" stroke-width="1.5" />
    <!-- Empty attribute compartment separator -->
    <line x1="0" y1="52" x2="280" y2="52" stroke="#333333" stroke-width="1" />
    <!-- Methods -->
    <text x="12" y="72" font-family="sans-serif" font-size="11px" font-weight="bold" fill="#888888">+</text>
    <text x="25" y="72" font-family="sans-serif" font-size="11px" fill="#000000">extractText(file: File): Promise&lt;string&gt;</text>
  </g>

  <!-- 2. Controller Class (Main Orchestrator) -->
  <g transform="translate(500, 80)">
    <rect x="0" y="0" width="360" height="190" fill="#ffffff" stroke="#333333" stroke-width="1.5" />
    <rect x="0" y="0" width="360" height="35" fill="#f3f3f3" stroke="#333333" stroke-width="1.5" />
    <text x="180" y="22" text-anchor="middle" font-family="sans-serif" font-weight="bold" font-size="12px" fill="#000000">Controller (DOM Listener)</text>
    <line x1="0" y1="35" x2="360" y2="35" stroke="#333333" stroke-width="1.5" />
    <!-- Attributes -->
    <text x="12" y="52" font-family="sans-serif" font-size="11px" font-weight="bold" fill="#888888">+</text>
    <text x="25" y="52" font-family="sans-serif" font-size="11px" fill="#333333">typingTimer: Timer</text>
    <text x="12" y="68" font-family="sans-serif" font-size="11px" font-weight="bold" fill="#888888">+</text>
    <text x="25" y="68" font-family="sans-serif" font-size="11px" fill="#333333">doneTypingInterval: int</text>
    <!-- Divider -->
    <line x1="0" y1="80" x2="360" y2="80" stroke="#333333" stroke-width="1.5" />
    <!-- Methods -->
    <text x="12" y="100" font-family="sans-serif" font-size="11px" font-weight="bold" fill="#888888">+</text>
    <text x="25" y="100" font-family="sans-serif" font-size="11px" fill="#000000">executeAnalysisCore(text, isSilent): bool</text>
    <text x="12" y="118" font-family="sans-serif" font-size="11px" font-weight="bold" fill="#888888">+</text>
    <text x="25" y="118" font-family="sans-serif" font-size="11px" fill="#000000">handleFileUpload(file: File): void</text>
    <text x="12" y="136" font-family="sans-serif" font-size="11px" font-weight="bold" fill="#888888">+</text>
    <text x="25" y="136" font-family="sans-serif" font-size="11px" fill="#000000">updateEditorStats(text: string): void</text>
    <text x="12" y="154" font-family="sans-serif" font-size="11px" font-weight="bold" fill="#888888">+</text>
    <text x="25" y="154" font-family="sans-serif" font-size="11px" fill="#000000">runAnalysis(text: string): void</text>
  </g>

  <!-- 3. ChartRenderer Class -->
  <g transform="translate(1020, 110)">
    <rect x="0" y="0" width="280" height="110" fill="#ffffff" stroke="#333333" stroke-width="1.5" />
    <rect x="0" y="0" width="280" height="35" fill="#f3f3f3" stroke="#333333" stroke-width="1.5" />
    <text x="140" y="22" text-anchor="middle" font-family="sans-serif" font-weight="bold" font-size="12px" fill="#000000">ChartRenderer</text>
    <line x1="0" y1="35" x2="280" y2="35" stroke="#333333" stroke-width="1.5" />
    <line x1="0" y1="52" x2="280" y2="52" stroke="#333333" stroke-width="1" />
    <text x="12" y="72" font-family="sans-serif" font-size="11px" font-weight="bold" fill="#888888">+</text>
    <text x="25" y="72" font-family="sans-serif" font-size="11px" fill="#000000">renderGauge(containerId, pct): void</text>
    <text x="12" y="90" font-family="sans-serif" font-size="11px" font-weight="bold" fill="#888888">+</text>
    <text x="25" y="90" font-family="sans-serif" font-size="11px" fill="#000000">renderHistoryChart(ctx, data): void</text>
  </g>

  <!-- ==================== ENSEMBLE ENGINES ==================== -->

  <!-- 4. PerplexityAnalyzer Class -->
  <g transform="translate(60, 360)">
    <rect x="0" y="0" width="260" height="110" fill="#ffffff" stroke="#333333" stroke-width="1.5" />
    <rect x="0" y="0" width="260" height="35" fill="#f3f3f3" stroke="#333333" stroke-width="1.5" />
    <text x="130" y="22" text-anchor="middle" font-family="sans-serif" font-weight="bold" font-size="12px" fill="#000000">PerplexityAnalyzer</text>
    <line x1="0" y1="35" x2="260" y2="35" stroke="#333333" stroke-width="1.5" />
    <line x1="0" y1="52" x2="260" y2="52" stroke="#333333" stroke-width="1" />
    <text x="12" y="72" font-family="sans-serif" font-size="11px" font-weight="bold" fill="#888888">+</text>
    <text x="25" y="72" font-family="sans-serif" font-size="11px" fill="#000000">analyze(text: string): PerplexityResult</text>
  </g>

  <!-- 5. KNNClassifier Class -->
  <g transform="translate(365, 360)">
    <rect x="0" y="0" width="275" height="120" fill="#ffffff" stroke="#333333" stroke-width="1.5" />
    <rect x="0" y="0" width="275" height="35" fill="#f3f3f3" stroke="#333333" stroke-width="1.5" />
    <text x="137" y="22" text-anchor="middle" font-family="sans-serif" font-weight="bold" font-size="12px" fill="#000000">KNNClassifier</text>
    <line x1="0" y1="35" x2="275" y2="35" stroke="#333333" stroke-width="1.5" />
    <line x1="0" y1="52" x2="275" y2="52" stroke="#333333" stroke-width="1" />
    <text x="12" y="72" font-family="sans-serif" font-size="11px" font-weight="bold" fill="#888888">+</text>
    <text x="25" y="72" font-family="sans-serif" font-size="11px" fill="#000000">extractFeatures(text, metrics)</text>
    <text x="12" y="90" font-family="sans-serif" font-size="11px" font-weight="bold" fill="#888888">+</text>
    <text x="25" y="90" font-family="sans-serif" font-size="11px" fill="#000000">classify(vector): KNNResult</text>
  </g>

  <!-- 6. LogisticRegressionClassifier Class -->
  <g transform="translate(680, 360)">
    <rect x="0" y="0" width="275" height="110" fill="#ffffff" stroke="#333333" stroke-width="1.5" />
    <rect x="0" y="0" width="275" height="35" fill="#f3f3f3" stroke="#333333" stroke-width="1.5" />
    <text x="137" y="22" text-anchor="middle" font-family="sans-serif" font-weight="bold" font-size="12px" fill="#000000">LogisticRegressionClassifier</text>
    <line x1="0" y1="35" x2="275" y2="35" stroke="#333333" stroke-width="1.5" />
    <line x1="0" y1="52" x2="275" y2="52" stroke="#333333" stroke-width="1" />
    <text x="12" y="72" font-family="sans-serif" font-size="11px" font-weight="bold" fill="#888888">+</text>
    <text x="25" y="72" font-family="sans-serif" font-size="11px" fill="#000000">predict(vector): number</text>
  </g>

  <!-- 7. CosineSimilarityAnalyzer Class -->
  <g transform="translate(995, 360)">
    <rect x="0" y="0" width="260" height="110" fill="#ffffff" stroke="#333333" stroke-width="1.5" />
    <rect x="0" y="0" width="260" height="35" fill="#f3f3f3" stroke="#333333" stroke-width="1.5" />
    <text x="130" y="22" text-anchor="middle" font-family="sans-serif" font-weight="bold" font-size="12px" fill="#000000">CosineSimilarityAnalyzer</text>
    <line x1="0" y1="35" x2="260" y2="35" stroke="#333333" stroke-width="1.5" />
    <line x1="0" y1="52" x2="260" y2="52" stroke="#333333" stroke-width="1" />
    <text x="12" y="72" font-family="sans-serif" font-size="11px" font-weight="bold" fill="#888888">+</text>
    <text x="25" y="72" font-family="sans-serif" font-size="11px" fill="#000000">analyze(text: string): SimResult</text>
  </g>

  <!-- 8. GrammarStyleAnalyzer Class -->
  <g transform="translate(180, 520)">
    <rect x="0" y="0" width="260" height="110" fill="#ffffff" stroke="#333333" stroke-width="1.5" />
    <rect x="0" y="0" width="260" height="35" fill="#f3f3f3" stroke="#333333" stroke-width="1.5" />

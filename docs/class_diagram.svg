    <line x1="0" y1="35" x2="260" y2="35" stroke="#333333" stroke-width="1.5" />
    <line x1="0" y1="52" x2="260" y2="52" stroke="#333333" stroke-width="1" />
    <text x="12" y="72" font-family="sans-serif" font-size="11px" font-weight="bold" fill="#888888">+</text>
    <text x="25" y="72" font-family="sans-serif" font-size="11px" fill="#000000">analyze(text: string): GrammarResult</text>
  </g>

  <!-- 9. TrigramAnalyzer Class -->
  <g transform="translate(510, 520)">
    <rect x="0" y="0" width="260" height="110" fill="#ffffff" stroke="#333333" stroke-width="1.5" />
    <rect x="0" y="0" width="260" height="35" fill="#f3f3f3" stroke="#333333" stroke-width="1.5" />
    <text x="130" y="22" text-anchor="middle" font-family="sans-serif" font-weight="bold" font-size="12px" fill="#000000">TrigramAnalyzer</text>
    <line x1="0" y1="35" x2="260" y2="35" stroke="#333333" stroke-width="1.5" />
    <line x1="0" y1="52" x2="260" y2="52" stroke="#333333" stroke-width="1" />
    <text x="12" y="72" font-family="sans-serif" font-size="11px" font-weight="bold" fill="#888888">+</text>
    <text x="25" y="72" font-family="sans-serif" font-size="11px" fill="#000000">analyze(text: string): TrigramResult</text>
  </g>

  <!-- 10. PosClassifier Class -->
  <g transform="translate(840, 520)">
    <rect x="0" y="0" width="260" height="110" fill="#ffffff" stroke="#333333" stroke-width="1.5" />
    <rect x="0" y="0" width="260" height="35" fill="#f3f3f3" stroke="#333333" stroke-width="1.5" />

    <text x="12" y="52" font-family="sans-serif" font-size="11px" font-weight="bold" fill="#888888">+</text>
    <text x="25" y="52" font-family="sans-serif" font-size="11px" fill="#333333">DB_FILE: str</text>
    <text x="12" y="68" font-family="sans-serif" font-size="11px" font-weight="bold" fill="#888888">+</text>
    <text x="25" y="68" font-family="sans-serif" font-size="11px" fill="#333333">PORT: int</text>
    <!-- Divider -->
    <line x1="0" y1="78" x2="280" y2="78" stroke="#333333" stroke-width="1.5" />
    <!-- Methods -->
    <text x="12" y="96" font-family="sans-serif" font-size="11px" font-weight="bold" fill="#888888">+</text>
    <text x="25" y="96" font-family="sans-serif" font-size="11px" fill="#000000">run(port: int): void</text>
    <text x="12" y="112" font-family="sans-serif" font-size="11px" font-weight="bold" fill="#888888">+</text>
    <text x="25" y="112" font-family="sans-serif" font-size="11px" fill="#000000">init_db(): void</text>
  </g>

  <!-- 13. BaseHTTPRequestHandler (Std Library Class) -->
  <g transform="translate(940, 710)">
    <rect x="0" y="0" width="240" height="70" fill="#ffffff" stroke="#333333" stroke-width="1.5" />
    <rect x="0" y="0" width="240" height="35" fill="#f9f9f9" stroke="#333333" stroke-dasharray="2 2" stroke-width="1.5" />
    <text x="120" y="22" text-anchor="middle" font-family="sans-serif" font-weight="bold" font-size="12px" fill="#666666">BaseHTTPRequestHandler</text>

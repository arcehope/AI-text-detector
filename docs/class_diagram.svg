    <text x="12" y="52" font-family="sans-serif" font-size="10px" font-style="italic" fill="#888888">// Standard Python HTTP class</text>
  </g>

  <!-- 14. RequestHandler Class -->
  <g transform="translate(930, 810)">
    <rect x="0" y="0" width="260" height="120" fill="#ffffff" stroke="#333333" stroke-width="1.5" />
    <rect x="0" y="0" width="260" height="35" fill="#f3f3f3" stroke="#333333" stroke-width="1.5" />
    <text x="130" y="22" text-anchor="middle" font-family="sans-serif" font-weight="bold" font-size="12px" fill="#000000">RequestHandler</text>
    <line x1="0" y1="35" x2="260" y2="35" stroke="#333333" stroke-width="1.5" />
    <line x1="0" y1="52" x2="260" y2="52" stroke="#333333" stroke-width="1" />
    <!-- Methods -->

  <text font-family="sans-serif" font-size="10px" fill="#777777" x="1070" y="802">inherits</text>

  <!-- Dependency: Controller -> FileParser -->
  <path d="M 500 160 L 352 160" fill="none" stroke="#555555" stroke-dasharray="4 2" stroke-width="1.5" marker-end="url(#arrow-classic)" />
  <!-- Dependency: Controller -> ChartRenderer -->
  <path d="M 860 160 L 1008 160" fill="none" stroke="#555555" stroke-dasharray="4 2" stroke-width="1.5" marker-end="url(#arrow-classic)" />


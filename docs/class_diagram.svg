    <line x1="0" y1="35" x2="260" y2="35" stroke="#333333" stroke-width="1.5" />
    <line x1="0" y1="52" x2="260" y2="52" stroke="#333333" stroke-width="1" />
    <text x="12" y="72" font-family="sans-serif" font-size="11px" font-weight="bold" fill="#888888">+</text>
    <text x="25" y="72" font-family="sans-serif" font-size="11px" fill="#000000">analyze(text: string): PosResult</text>
  </g>

  <!-- ==================== PERSISTENCE STORES ==================== -->

  <!-- 11. SentinelDB Class -->
  <g transform="translate(180, 740)">
    <rect x="0" y="0" width="300" height="160" fill="#ffffff" stroke="#333333" stroke-width="1.5" />
    <rect x="0" y="0" width="300" height="35" fill="#f3f3f3" stroke="#333333" stroke-width="1.5" />
    <text x="150" y="22" text-anchor="middle" font-family="sans-serif" font-weight="bold" font-size="12px" fill="#000000">SentinelDB</text>
    <line x1="0" y1="35" x2="300" y2="35" stroke="#333333" stroke-width="1.5" />
    <!-- Attributes -->
    <text x="12" y="52" font-family="sans-serif" font-size="11px" font-weight="bold" fill="#888888">+</text>
    <text x="25" y="52" font-family="sans-serif" font-size="11px" fill="#333333">initialized: boolean</text>
    <text x="12" y="68" font-family="sans-serif" font-size="11px" font-weight="bold" fill="#888888">+</text>
    <text x="25" y="68" font-family="sans-serif" font-size="11px" fill="#333333">backendAvailable: boolean</text>
    <!-- Divider -->
    <line x1="0" y1="78" x2="300" y2="78" stroke="#333333" stroke-width="1.5" />
    <!-- Methods -->
    <text x="12" y="96" font-family="sans-serif" font-size="11px" font-weight="bold" fill="#888888">+</text>
    <text x="25" y="96" font-family="sans-serif" font-size="11px" fill="#000000">init(): Promise&lt;boolean&gt;</text>
    <text x="12" y="112" font-family="sans-serif" font-size="11px" font-weight="bold" fill="#888888">+</text>
    <text x="25" y="112" font-family="sans-serif" font-size="11px" fill="#000000">getCurrentUser(): Object</text>
    <text x="12" y="128" font-family="sans-serif" font-size="11px" font-weight="bold" fill="#888888">+</text>
    <text x="25" y="128" font-family="sans-serif" font-size="11px" fill="#000000">saveRecord(record): Promise&lt;string&gt;</text>
  </g>

  <!-- 12. SentinelServer Class -->
  <g transform="translate(540, 740)">
    <rect x="0" y="0" width="280" height="130" fill="#ffffff" stroke="#333333" stroke-width="1.5" />
    <rect x="0" y="0" width="280" height="35" fill="#f3f3f3" stroke="#333333" stroke-width="1.5" />
    <text x="140" y="22" text-anchor="middle" font-family="sans-serif" font-weight="bold" font-size="12px" fill="#000000">SentinelServer (server.py)</text>
    <line x1="0" y1="35" x2="280" y2="35" stroke="#333333" stroke-width="1.5" />

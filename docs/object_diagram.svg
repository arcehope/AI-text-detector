<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" version="1.1" viewBox="0 0 1320 920" width="100%" height="100%" style="background-color: #ffffff; font-family: Helvetica, Arial, sans-serif;">
  <defs>
    <style type="text/css">
      .uml-box { fill: #ffffff; stroke: #000000; stroke-width: 1.5; }
      .uml-title { font-family: Helvetica, Arial, sans-serif; font-weight: bold; font-size: 13px; fill: #000000; text-anchor: middle; }
      .uml-text { font-family: Helvetica, Arial, sans-serif; font-size: 11.5px; fill: #000000; }
      .uml-line { stroke: #000000; stroke-width: 1.5; fill: none; }
      .uml-label { font-family: Helvetica, Arial, sans-serif; font-size: 11px; fill: #000000; font-weight: bold; }
    </style>
  </defs>

  <!-- Canvas Background -->
  <rect width="1320" height="920" fill="#ffffff" />
  
  <!-- Outer Border (Canvas Paper Limit) -->
  <rect x="15" y="15" width="1290" height="890" fill="none" stroke="#e0e0e0" stroke-width="1" stroke-dasharray="4,4" />

  <!-- ==================== CONNECTIONS ==================== -->

  <!-- Connector 1: Parses -> Sentence Perplexity -->
  <path d="M 570 240 V 280 H 230 V 320" class="uml-line" />
  <text x="580" y="260" class="uml-label">1</text>
  <text x="240" y="310" class="uml-label">0..*</text>

  <!-- Connector 2: Parses -> Vector Similarities -->
  <path d="M 730 240 V 280 H 1080 V 320" class="uml-line" />
  <text x="715" y="260" class="uml-label">1</text>
  <text x="1065" y="310" class="uml-label">0..*</text>

  <!-- Connector 3: Sentence Perplexity -> Instance Based Classification -->
  <path d="M 390 445 H 470" class="uml-line" />
  <text x="400" y="435" class="uml-label">1</text>
  <text x="450" y="435" class="uml-label">1..*</text>

  <!-- Connector 4: Vector Similarities -> Instance Based Classification -->
  <path d="M 910 445 H 830" class="uml-line" />
  <text x="895" y="435" class="uml-label">1</text>
  <text x="845" y="435" class="uml-label">1..*</text>

  <!-- Connector 5: Instance Based Classification -> Render SVG visualization -->
  <path d="M 650 570 V 640" class="uml-line" />
  <text x="660" y="590" class="uml-label">1</text>
  <text x="660" y="630" class="uml-label">1</text>


  <!-- ==================== CLASS 1: Parses ==================== -->
  <g transform="translate(470, 50)">
    <rect width="360" height="190" class="uml-box" />
    <!-- Title -->
    <text x="180" y="21" class="uml-title">Parses</text>
    <line x1="0" y1="32" x2="360" y2="32" stroke="#000000" stroke-width="1.5" />

    <!-- Attributes -->
    <text x="12" y="48" class="uml-text">- supportedTypes: list</text>
    <text x="12" y="65" class="uml-text">- pdfWorkerSrc: string</text>
    <text x="12" y="82" class="uml-text">- rawBuffer: string</text>
    <text x="12" y="99" class="uml-text">- extractedText: string</text>
    <line x1="0" y1="110" x2="360" y2="110" stroke="#000000" stroke-width="1.5" />

    <!-- Methods -->
    <text x="12" y="126" class="uml-text">+ extractText(file): string</text>
    <text x="12" y="143" class="uml-text">+ readAsDocx(file): string</text>
    <text x="12" y="160" class="uml-text">+ readAsPdf(file): string</text>
    <text x="12" y="177" class="uml-text">+ getWordCount(): int</text>
  </g>


  <!-- ==================== CLASS 2: Sentence Perplexity ==================== -->
  <g transform="translate(70, 320)">
    <rect width="320" height="250" class="uml-box" />
    <!-- Title -->
    <text x="160" y="21" class="uml-title">Sentence Perplexity</text>
    <line x1="0" y1="32" x2="320" y2="32" stroke="#000000" stroke-width="1.5" />

    <!-- Attributes -->
    <text x="12" y="48" class="uml-text">- aiFavoredWords: set</text>
    <text x="12" y="65" class="uml-text">- commonBigrams: set</text>
    <text x="12" y="82" class="uml-text">- perplexityScore: float</text>
    <text x="12" y="99" class="uml-text">- burstinessValue: float</text>
    <text x="12" y="116" class="uml-text">- sentenceLengths: list</text>
    <line x1="0" y1="127" x2="320" y2="127" stroke="#000000" stroke-width="1.5" />

    <!-- Methods -->
    <text x="12" y="143" class="uml-text">+ calculatePerplexity(text): float</text>
    <text x="12" y="160" class="uml-text">+ calculateBurstiness(sentences): float</text>
    <text x="12" y="177" class="uml-text">+ computeTTR(tokens): float</text>
    <text x="12" y="194" class="uml-text">+ getAiWordDensity(text): float</text>
    <text x="12" y="211" class="uml-text">+ getSentenceLengthVariance(): float</text>
    <text x="12" y="228" class="uml-text">+ getPerplexityVerdict(): string</text>
  </g>


  <!-- ==================== CLASS 4: Instance Based Classification ==================== -->
  <g transform="translate(470, 320)">
    <rect width="360" height="250" class="uml-box" />
    <!-- Title -->
    <text x="180" y="21" class="uml-title">Instance Based Classification</text>
    <line x1="0" y1="32" x2="360" y2="32" stroke="#000000" stroke-width="1.5" />

    <!-- Attributes -->
    <text x="12" y="48" class="uml-text">- k: int</text>
    <text x="12" y="65" class="uml-text">- trainingSet: list</text>
    <text x="12" y="82" class="uml-text">- aiVotes: int</text>
    <text x="12" y="99" class="uml-text">- humanVotes: int</text>
    <text x="12" y="116" class="uml-text">- predictedClass: string</text>
    <text x="12" y="133" class="uml-text">- confidenceScore: float</text>
    <line x1="0" y1="144" x2="360" y2="144" stroke="#000000" stroke-width="1.5" />

    <!-- Methods -->
    <text x="12" y="160" class="uml-text">+ classify(featureVector): object</text>
    <text x="12" y="177" class="uml-text">+ computeEuclideanDistance(v1, v2): float</text>
    <text x="12" y="194" class="uml-text">+ getNearestNeighbors(vector, k): list</text>
    <text x="12" y="211" class="uml-text">+ getVerdictSummary(): object</text>
    <text x="12" y="228" class="uml-text">+ updateTrainingSet(sample): void</text>
  </g>


  <!-- ==================== CLASS 3: Vector Similarities ==================== -->
  <g transform="translate(910, 320)">
    <rect width="340" height="250" class="uml-box" />
    <!-- Title -->
    <text x="170" y="21" class="uml-title">Vector Similarities</text>
    <line x1="0" y1="32" x2="340" y2="32" stroke="#000000" stroke-width="1.5" />

    <!-- Attributes -->
    <text x="12" y="48" class="uml-text">- humanPrototype: list</text>
    <text x="12" y="65" class="uml-text">- aiPrototype: list</text>
    <text x="12" y="82" class="uml-text">- cosineDistance: float</text>
    <text x="12" y="99" class="uml-text">- ngramDistributions: list</text>
    <text x="12" y="116" class="uml-text">- similarityScore: float</text>
    <line x1="0" y1="127" x2="340" y2="127" stroke="#000000" stroke-width="1.5" />

    <!-- Methods -->
    <text x="12" y="143" class="uml-text">+ computeCosineSimilarity(v1, v2): float</text>
    <text x="12" y="160" class="uml-text">+ extractNgramFrequency(text): list</text>
    <text x="12" y="177" class="uml-text">+ comparePrototypes(vector): object</text>
    <text x="12" y="194" class="uml-text">+ getFeatureVector(): list</text>
    <text x="12" y="211" class="uml-text">+ normalizeVector(vector): list</text>
    <text x="12" y="228" class="uml-text">+ getSimilarityIndex(): float</text>
  </g>


  <!-- ==================== CLASS 5: Render SVG visualization ==================== -->
  <g transform="translate(470, 640)">
    <rect width="360" height="230" class="uml-box" />
    <!-- Title -->
    <text x="180" y="21" class="uml-title">Render SVG visualization</text>
    <line x1="0" y1="32" x2="360" y2="32" stroke="#000000" stroke-width="1.5" />

    <!-- Attributes -->
    <text x="12" y="48" class="uml-text">- svgGlowFilter: string</text>
    <text x="12" y="65" class="uml-text">- gaugeContainer: Element</text>
    <text x="12" y="82" class="uml-text">- colorMap: object</text>
    <text x="12" y="99" class="uml-text">- animationDuration: int</text>
    <line x1="0" y1="110" x2="360" y2="110" stroke="#000000" stroke-width="1.5" />

    <!-- Methods -->
    <text x="12" y="126" class="uml-text">+ renderGaugeChart(score): Element</text>
    <text x="12" y="143" class="uml-text">+ renderScatterPlot(neighbors): Element</text>
    <text x="12" y="160" class="uml-text">+ renderRadarChart(features): Element</text>
    <text x="12" y="177" class="uml-text">+ animateGaugePointer(angle): void</text>
    <text x="12" y="194" class="uml-text">+ updateVerdictDisplay(text): void</text>
    <text x="12" y="211" class="uml-text">+ exportAsSVG(): string</text>
  </g>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1360 980" width="100%" height="100%">
  <defs>
    <!-- Background grid -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <circle cx="20" cy="20" r="1" fill="#2d3748" opacity="0.6"/>
    </pattern>

    <!-- Card background gradient -->
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1b2030" />
      <stop offset="100%" stop-color="#0f121d" />
    </linearGradient>

    <!-- Header gradients -->
    <linearGradient id="blueHeader" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#1d4ed8" />
    </linearGradient>
    <linearGradient id="purpleHeader" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#6d28d9" />
    </linearGradient>
    <linearGradient id="tealHeader" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#047857" />
    </linearGradient>
    <linearGradient id="amberHeader" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#b45309" />
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="6" flood-color="#000000" flood-opacity="0.5"/>
    </filter>

    <!-- Connection markers (arrows) -->
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#3b82f6" />
    </marker>
    <marker id="arrow-purple" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#a78bfa" />
    </marker>
    <marker id="arrow-teal" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#34d399" />
    </marker>
    <marker id="arrow-amber" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#fbbf24" />
    </marker>
  </defs>

  <style>
    .title { font-family: system-ui, -apple-system, sans-serif; font-size: 24px; font-weight: 800; fill: #ffffff; letter-spacing: 0.5px; }
    .subtitle { font-family: system-ui, -apple-system, sans-serif; font-size: 13px; fill: #94a3b8; }
    .card-title { font-family: system-ui, -apple-system, sans-serif; font-size: 13px; font-weight: 700; fill: #ffffff; }
    .card-type { font-family: system-ui, -apple-system, sans-serif; font-size: 9px; font-weight: 800; fill: rgba(255,255,255,0.7); letter-spacing: 1px; }
    .prop-name { font-family: monospace; font-size: 11px; fill: #93c5fd; }
    .prop-val { font-family: monospace; font-size: 11px; fill: #cbd5e1; }
    .method { font-family: monospace; font-size: 11px; fill: #34d399; }
    .comment { font-family: system-ui, -apple-system, sans-serif; font-size: 10px; font-style: italic; fill: #64748b; }
    .section-label { font-family: system-ui, -apple-system, sans-serif; font-size: 10px; font-weight: 700; fill: #475569; letter-spacing: 0.5px; }
    .line-label { font-family: system-ui, -apple-system, sans-serif; font-size: 11px; font-weight: 600; fill: #94a3b8; text-shadow: 0px 1px 3px rgba(0,0,0,0.8); }
    .card-border { stroke: #334155; stroke-width: 1.5px; fill: url(#cardGrad); filter: url(#shadow); }
    .connection-line { fill: none; stroke-width: 2px; stroke-dasharray: 4 2; }
    .solid-connection { fill: none; stroke-width: 2px; }
  </style>

  <!-- Dark Background -->
  <rect width="100%" height="100%" fill="#0b0f19" />
  <rect width="100%" height="100%" fill="url(#grid)" />

  <!-- Diagram Header -->
  <g transform="translate(40, 45)">
    <text class="title">SENTINEL AI TEXT DETECTOR</text>
    <text class="subtitle" y="22">UML Object Diagram - Runtime Instances, Collaborations, and API Sync Flow</text>
  </g>

  <!-- ==================== OBJECTS (CARDS) ==================== -->

  <!-- 1. fileParser : FileParser -->
  <g transform="translate(60, 110)">
    <rect class="card-border" width="280" height="130" rx="10"/>
    <path d="M 0 10 A 10 10 0 0 1 10 0 L 270 0 A 10 10 0 0 1 280 10 L 280 32 L 0 32 Z" fill="url(#tealHeader)"/>
    <text class="card-title" x="15" y="20">fileParser : FileParser</text>
    <text class="card-type" x="205" y="20">UTILITY</text>
    
    <!-- Methods -->
    <text class="section-label" x="15" y="52">METHODS</text>
    <text class="method" x="15" y="72">+ extractText(file: File): Promise&lt;string&gt;</text>
    <text class="comment" x="15" y="90">// Parses pdf, docx, txt files into raw text</text>
  </g>

  <!-- 2. app : Controller -->
  <g transform="translate(500, 80)">
    <rect class="card-border" width="360" height="200" rx="10" stroke="#3b82f6" stroke-width="2"/>
    <path d="M 0 10 A 10 10 0 0 1 10 0 L 350 0 A 10 10 0 0 1 360 10 L 360 32 L 0 32 Z" fill="url(#blueHeader)"/>
    <text class="card-title" x="15" y="20">app : Controller (DOMContentLoaded)</text>
    <text class="card-type" x="270" y="20">CORE CONTROLLER</text>
    
    <!-- Fields -->
    <text class="section-label" x="15" y="50">PROPERTIES</text>
    <text class="prop-name" x="15" y="68">typingTimer<tspan class="prop-val">: Timer = null</tspan></text>
    <text class="prop-name" x="15" y="84">doneTypingInterval<tspan class="prop-val">: number = 1000</tspan></text>
    
    <line x1="15" y1="98" x2="345" y2="98" stroke="#334155" stroke-width="1"/>
    
    <!-- Methods -->
    <text class="section-label" x="15" y="115">METHODS</text>
    <text class="method" x="15" y="132">+ executeAnalysisCore(text, isSilent)</text>
    <text class="method" x="15" y="148">+ handleFileUpload(file)</text>
    <text class="method" x="15" y="164">+ updateEditorStats(text)</text>
    <text class="method" x="15" y="180">+ runAnalysis(text)</text>
  </g>

  <!-- 3. chartEngine : ChartRenderer -->
  <g transform="translate(1020, 110)">
    <rect class="card-border" width="280" height="130" rx="10"/>
    <path d="M 0 10 A 10 10 0 0 1 10 0 L 270 0 A 10 10 0 0 1 280 10 L 280 32 L 0 32 Z" fill="url(#tealHeader)"/>
    <text class="card-title" x="15" y="20">chartEngine : ChartRenderer</text>
    <text class="card-type" x="205" y="20">UTILITY</text>
    
    <!-- Methods -->
    <text class="section-label" x="15" y="52">METHODS</text>
    <text class="method" x="15" y="72">+ renderGauge(containerId, pct)</text>
    <text class="method" x="15" y="88">+ renderHistoryChart(ctx, data)</text>
    <text class="comment" x="15" y="108">// Outputs customizable dynamic SVG charts</text>
  </g>

  <!-- ==================== ENSEMBLE ENGINES ==================== -->

  <!-- 4. perplexityEngine : PerplexityAnalyzer -->
  <g transform="translate(60, 360)">
    <rect class="card-border" width="275" height="130" rx="10"/>
    <path d="M 0 10 A 10 10 0 0 1 10 0 L 265 0 A 10 10 0 0 1 275 10 L 275 32 L 0 32 Z" fill="url(#purpleHeader)"/>
    <text class="card-title" x="15" y="20">perplexityEngine : PerplexityAnalyzer</text>
    <text class="card-type" x="210" y="20">ENGINE</text>
    <text class="section-label" x="15" y="52">METHODS</text>
    <text class="method" x="15" y="72">+ analyze(text): PerplexityResult</text>
    <text class="comment" x="15" y="92">// Computes Perplexity, Burstiness, TTR,</text>
    <text class="comment" x="15" y="106">// Word/Sentence counts (Weight: 5%)</text>
  </g>

  <!-- 5. knnClassifier : KNNClassifier -->
  <g transform="translate(375, 360)">
    <rect class="card-border" width="285" height="150" rx="10"/>
    <path d="M 0 10 A 10 10 0 0 1 10 0 L 275 0 A 10 10 0 0 1 285 10 L 285 32 L 0 32 Z" fill="url(#purpleHeader)"/>
    <text class="card-title" x="15" y="20">knnClassifier : KNNClassifier</text>
    <text class="card-type" x="220" y="20">ENGINE</text>
    <text class="section-label" x="15" y="52">METHODS</text>
    <text class="method" x="15" y="72">+ extractFeatures(text, metrics)</text>
    <text class="method" x="15" y="88">+ classify(vector): KNNResult</text>
    <text class="comment" x="15" y="110">// Classifies text using vector distance</text>
    <text class="comment" x="15" y="124">// against reference database (Weight: 20%)</text>
  </g>

  <!-- 6. lrClassifier : LogisticRegressionClassifier -->
  <g transform="translate(700, 360)">
    <rect class="card-border" width="285" height="130" rx="10"/>
    <path d="M 0 10 A 10 10 0 0 1 10 0 L 275 0 A 10 10 0 0 1 285 10 L 285 32 L 0 32 Z" fill="url(#purpleHeader)"/>
    <text class="card-title" x="15" y="20">lrClassifier : LogisticRegression</text>
    <text class="card-type" x="220" y="20">ENGINE</text>
    <text class="section-label" x="15" y="52">METHODS</text>
    <text class="method" x="15" y="72">+ predict(vector): number</text>
    <text class="comment" x="15" y="92">// Combines feature vectors via trained weight</text>
    <text class="comment" x="15" y="106">// coefficients to output AI prob (Weight: 25%)</text>
  </g>

  <!-- 7. similarityEngine : CosineSimilarityAnalyzer -->
  <g transform="translate(1025, 360)">
    <rect class="card-border" width="275" height="130" rx="10"/>
    <path d="M 0 10 A 10 10 0 0 1 10 0 L 265 0 A 10 10 0 0 1 275 10 L 275 32 L 0 32 Z" fill="url(#purpleHeader)"/>
    <text class="card-title" x="15" y="20">similarityEngine : CosineSimilarity</text>
    <text class="card-type" x="210" y="20">ENGINE</text>
    <text class="section-label" x="15" y="52">METHODS</text>
    <text class="method" x="15" y="72">+ analyze(text): SimResult</text>
    <text class="comment" x="15" y="92">// Measures semantic overlap with known</text>
    <text class="comment" x="15" y="106">// human and AI structures (Weight: 10%)</text>
  </g>

  <!-- 8. grammarEngine : GrammarStyleAnalyzer -->
  <g transform="translate(210, 540)">
    <rect class="card-border" width="280" height="130" rx="10"/>
    <path d="M 0 10 A 10 10 0 0 1 10 0 L 270 0 A 10 10 0 0 1 280 10 L 280 32 L 0 32 Z" fill="url(#purpleHeader)"/>
    <text class="card-title" x="15" y="20">grammarEngine : GrammarStyle</text>
    <text class="card-type" x="215" y="20">ENGINE</text>
    <text class="section-label" x="15" y="52">METHODS</text>
    <text class="method" x="15" y="72">+ analyze(text): GrammarResult</text>
    <text class="comment" x="15" y="92">// Calibrates the final ensemble score: perfect</text>
    <text class="comment" x="15" y="106">// grammar boosts AI score, typos reduce it</text>
  </g>

  <!-- 9. trigramEngine : TrigramAnalyzer -->
  <g transform="translate(540, 540)">
    <rect class="card-border" width="280" height="130" rx="10"/>
    <path d="M 0 10 A 10 10 0 0 1 10 0 L 270 0 A 10 10 0 0 1 280 10 L 280 32 L 0 32 Z" fill="url(#purpleHeader)"/>
    <text class="card-title" x="15" y="20">trigramEngine : TrigramAnalyzer</text>
    <text class="card-type" x="215" y="20">ENGINE</text>
    <text class="section-label" x="15" y="52">METHODS</text>
    <text class="method" x="15" y="72">+ analyze(text): TrigramResult</text>
    <text class="comment" x="15" y="92">// Analyzes frequency distribution of 3-char</text>
    <text class="comment" x="15" y="106">// sequences against models (Weight: 25%)</text>
  </g>

  <!-- 10. posEngine : PosClassifier -->
  <g transform="translate(870, 540)">
    <rect class="card-border" width="280" height="130" rx="10"/>
    <path d="M 0 10 A 10 10 0 0 1 10 0 L 270 0 A 10 10 0 0 1 280 10 L 280 32 L 0 32 Z" fill="url(#purpleHeader)"/>
    <text class="card-title" x="15" y="20">posEngine : PosClassifier</text>
    <text class="card-type" x="215" y="20">ENGINE</text>
    <text class="section-label" x="15" y="52">METHODS</text>
    <text class="method" x="15" y="72">+ analyze(text): PosResult</text>
    <text class="comment" x="15" y="92">// Part-of-speech tagging; evaluates noun/verb</text>
    <text class="comment" x="15" y="106">// syntactic patterns (Weight: 15%)</text>
  </g>

  <!-- ==================== PERSISTENT STORES ==================== -->

  <!-- 11. db : SentinelDB -->
  <g transform="translate(190, 740)">
    <rect class="card-border" width="380" height="190" rx="10"/>
    <path d="M 0 10 A 10 10 0 0 1 10 0 L 370 0 A 10 10 0 0 1 380 10 L 380 32 L 0 32 Z" fill="url(#amberHeader)"/>
    <text class="card-title" x="15" y="20">db : SentinelDB (IndexedDB Helper)</text>
    <text class="card-type" x="280" y="20">DATABASE MGR</text>
    
    <!-- Fields -->
    <text class="section-label" x="15" y="50">PROPERTIES</text>
    <text class="prop-name" x="15" y="68">initialized<tspan class="prop-val">: boolean = true</tspan></text>
    <text class="prop-name" x="15" y="84">backendAvailable<tspan class="prop-val">: boolean = true (fallback: IndexedDB)</tspan></text>
    
    <line x1="15" y1="98" x2="365" y2="98" stroke="#334155" stroke-width="1"/>
    
    <!-- Methods -->
    <text class="section-label" x="15" y="115">METHODS</text>
    <text class="method" x="15" y="132">+ init(): Promise&lt;boolean&gt;</text>
    <text class="method" x="15" y="148">+ getCurrentUser(): Object</text>
    <text class="method" x="15" y="164">+ saveRecord(record: Object): Promise&lt;string&gt;</text>
    <text class="method" x="15" y="180">+ deleteRecord(id: string): Promise&lt;boolean&gt;</text>
  </g>

  <!-- 12. backend : SentinelServer -->
  <g transform="translate(790, 740)">
    <rect class="card-border" width="380" height="190" rx="10"/>
    <path d="M 0 10 A 10 10 0 0 1 10 0 L 370 0 A 10 10 0 0 1 380 10 L 380 32 L 0 32 Z" fill="url(#amberHeader)"/>
    <text class="card-title" x="15" y="20">backend : SentinelServer (server.py)</text>
    <text class="card-type" x="275" y="20">SQLITE + HTTP SERVER</text>
    
    <!-- Fields -->
    <text class="section-label" x="15" y="50">PROPERTIES</text>
    <text class="prop-name" x="15" y="68">DB_FILE<tspan class="prop-val">: str = "./sentinel.db"</tspan></text>
    <text class="prop-name" x="15" y="84">PORT<tspan class="prop-val">: int = 5000</tspan></text>
    
    <line x1="15" y1="98" x2="365" y2="98" stroke="#334155" stroke-width="1"/>
    
    <!-- Methods -->
    <text class="section-label" x="15" y="115">ENDPOINTS</text>
    <text class="method" x="15" y="132">POST /api/auth/register, /api/auth/login</text>
    <text class="method" x="15" y="148">POST /api/history/save</text>
    <text class="method" x="15" y="164">GET /api/history?username=...</text>
    <text class="method" x="15" y="180">DELETE /api/history/delete</text>
  </g>


  <!-- ==================== RELATIONSHIP LINES (CONNECTIONS) ==================== -->

  <!-- App -> FileParser -->
  <path d="M 500 160 L 352 160" class="solid-connection" stroke="#10b981" marker-end="url(#arrow-teal)"/>
  <text class="line-label" x="380" y="152">1. parses files</text>

  <!-- App -> ChartEngine -->
  <path d="M 860 160 L 1008 160" class="solid-connection" stroke="#10b981" marker-end="url(#arrow-teal)"/>
  <text class="line-label" x="880" y="152">3. renders gauge</text>

  <!-- App -> db -->
  <path d="M 540 280 C 540 330, 240 600, 240 728" class="solid-connection" stroke="#f59e0b" marker-end="url(#arrow-amber)"/>
  <text class="line-label" x="250" y="660">Saves history &amp; auth</text>

  <!-- db -> backend (HTTP API Sync) -->
  <!-- Forward (request) -->
  <path d="M 570 810 L 778 810" class="solid-connection" stroke="#f59e0b" marker-end="url(#arrow-amber)"/>
  <text class="line-label" x="600" y="802">sync over REST API (JSON)</text>
  <!-- Backward (response) -->
  <path d="M 790 850 L 582 850" class="solid-connection" stroke="#f59e0b" marker-end="url(#arrow-amber)"/>
  <text class="line-label" x="635" y="870">auth &amp; history response</text>

  <!-- App -> Engines (Group call orchestration for analysis) -->
  <!-- Branched routes from App Bottom -->
  
  <!-- To perplexityEngine -->
  <path d="M 680 280 C 680 310, 197 300, 197 348" class="connection-line" stroke="#8b5cf6" marker-end="url(#arrow-purple)"/>
  
  <!-- To knnClassifier -->
  <path d="M 680 280 C 680 310, 517 310, 517 348" class="connection-line" stroke="#8b5cf6" marker-end="url(#arrow-purple)"/>
  
  <!-- To lrClassifier -->
  <path d="M 680 280 C 680 310, 842 310, 842 348" class="connection-line" stroke="#8b5cf6" marker-end="url(#arrow-purple)"/>
  
  <!-- To similarityEngine -->
  <path d="M 680 280 C 680 310, 1162 300, 1162 348" class="connection-line" stroke="#8b5cf6" marker-end="url(#arrow-purple)"/>

  <!-- To grammarEngine -->
  <path d="M 680 280 C 680 330, 350 490, 350 528" class="connection-line" stroke="#8b5cf6" marker-end="url(#arrow-purple)"/>

  <!-- To trigramEngine -->
  <path d="M 680 280 C 680 330, 680 490, 680 528" class="connection-line" stroke="#8b5cf6" marker-end="url(#arrow-purple)"/>

  <!-- To posEngine -->
  <path d="M 680 280 C 680 330, 1010 490, 1010 528" class="connection-line" stroke="#8b5cf6" marker-end="url(#arrow-purple)"/>

  <rect x="610" y="295" width="140" height="22" rx="4" fill="#1e1b4b" stroke="#4c1d95" stroke-width="1"/>
  <text class="line-label" x="618" y="310" fill="#c084fc">2. execute analysis</text>

  <!-- perplexityEngine -> knnClassifier (Feature extraction metrics pass) -->
  <path d="M 335 425 L 363 425" class="solid-connection" stroke="#8b5cf6" marker-end="url(#arrow-purple)"/>
  <text class="line-label" x="338" y="442" fill="#c084fc">metrics</text>

</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 620" width="100%" height="100%">
  <defs>
    <!-- Simple hollow diamond marker for aggregation (placed at the start of paths) -->
    <marker id="diamond-start" viewBox="0 0 20 10" refX="0" refY="5" markerWidth="14" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 5 L 10 0 L 20 5 L 10 10 Z" fill="#ffffff" stroke="#000000" stroke-width="1" />
    </marker>
  </defs>

  <!-- Plain White Background -->
  <rect width="100%" height="100%" fill="#ffffff" />

  <!-- ==================== CLASSES (UML BOXES) ==================== -->

  <!-- 1. Account Class (2 compartments: name/attrs) -->
  <g transform="translate(20, 20)">
    <rect x="0" y="0" width="160" height="120" fill="#ffffff" stroke="#000000" stroke-width="1" />
    <text x="80" y="20" text-anchor="middle" font-family="sans-serif" font-weight="bold" font-size="13px" fill="#000000">Account</text>
    <line x1="0" y1="30" x2="160" y2="30" stroke="#000000" stroke-width="1" />
    <text x="10" y="48" font-family="sans-serif" font-size="12px" fill="#000000">+ username</text>
    <text x="10" y="68" font-family="sans-serif" font-size="12px" fill="#000000">+ password</text>
    <text x="10" y="88" font-family="sans-serif" font-size="12px" fill="#000000">+ role</text>
  </g>

  <!-- 2. Controller Class (1 compartment: name only, like Organizer) -->
  <g transform="translate(380, 20)">
    <rect x="0" y="0" width="180" height="60" fill="#ffffff" stroke="#000000" stroke-width="1" />
    <text x="90" y="35" text-anchor="middle" font-family="sans-serif" font-weight="bold" font-size="14px" fill="#000000">Controller</text>
  </g>

  <!-- 3. Ensemble Class (2 compartments: name/attrs, like Staff) -->
  <g transform="translate(40, 230)">
    <rect x="0" y="0" width="160" height="70" fill="#ffffff" stroke="#000000" stroke-width="1" />
    <text x="80" y="20" text-anchor="middle" font-family="sans-serif" font-weight="bold" font-size="13px" fill="#000000">Ensemble</text>
    <line x1="0" y1="30" x2="160" y2="30" stroke="#000000" stroke-width="1" />
    <text x="10" y="50" font-family="sans-serif" font-size="12px" fill="#000000">+ weights</text>
  </g>

  <!-- 4. SentinelServer Class (3 compartments: name/empty/methods, like Statistics) -->
  <g transform="translate(370, 230)">
    <rect x="0" y="0" width="200" height="130" fill="#ffffff" stroke="#000000" stroke-width="1" />
    <text x="100" y="20" text-anchor="middle" font-family="sans-serif" font-weight="bold" font-size="13px" fill="#000000">SentinelServer</text>
    <line x1="0" y1="30" x2="200" y2="30" stroke="#000000" stroke-width="1" />
    <!-- Empty Attributes compartment -->
    <line x1="0" y1="50" x2="200" y2="50" stroke="#000000" stroke-width="1" />
    <!-- Methods -->
    <text x="10" y="70" font-family="sans-serif" font-size="12px" fill="#000000">+ run()</text>
    <text x="10" y="90" font-family="sans-serif" font-size="12px" fill="#000000">+ init_db()</text>
    <text x="10" y="110" font-family="sans-serif" font-size="12px" fill="#000000">+ handleRequest()</text>
  </g>

  <!-- 5. FileParser Class (2 compartments: name/attrs, like BreakPlan) -->
  <g transform="translate(730, 230)">
    <rect x="0" y="0" width="160" height="70" fill="#ffffff" stroke="#000000" stroke-width="1" />
    <text x="80" y="20" text-anchor="middle" font-family="sans-serif" font-weight="bold" font-size="13px" fill="#000000">FileParser</text>
    <line x1="0" y1="30" x2="160" y2="30" stroke="#000000" stroke-width="1" />
    <text x="10" y="50" font-family="sans-serif" font-size="12px" fill="#000000">+ docxParser</text>
  </g>

  <!-- 6. SentinelDB Class (3 compartments: name/attrs/methods, like Teacher) -->
  <g transform="translate(20, 440)">
    <rect x="0" y="0" width="220" height="140" fill="#ffffff" stroke="#000000" stroke-width="1" />
    <text x="110" y="20" text-anchor="middle" font-family="sans-serif" font-weight="bold" font-size="13px" fill="#000000">SentinelDB</text>
    <line x1="0" y1="30" x2="220" y2="30" stroke="#000000" stroke-width="1" />
    <!-- Attributes -->
    <text x="10" y="48" font-family="sans-serif" font-size="12px" fill="#000000">+ initialized</text>
    <text x="10" y="68" font-family="sans-serif" font-size="12px" fill="#000000">+ backendAvailable</text>
    <line x1="0" y1="78" x2="220" y2="78" stroke="#000000" stroke-width="1" />
    <!-- Methods -->
    <text x="10" y="98" font-family="sans-serif" font-size="12px" fill="#000000">+ init()</text>
    <text x="10" y="118" font-family="sans-serif" font-size="12px" fill="#000000">+ saveRecord()</text>
  </g>

  <!-- 7. ChartRenderer Class (3 compartments: name/empty/methods, like Break) -->
  <g transform="translate(710, 440)">
    <rect x="0" y="0" width="180" height="90" fill="#ffffff" stroke="#000000" stroke-width="1" />
    <text x="90" y="20" text-anchor="middle" font-family="sans-serif" font-weight="bold" font-size="13px" fill="#000000">ChartRenderer</text>
    <line x1="0" y1="30" x2="180" y2="30" stroke="#000000" stroke-width="1" />
    <!-- Empty Attributes compartment -->
    <line x1="0" y1="50" x2="180" y2="50" stroke="#000000" stroke-width="1" />
    <!-- Methods -->
    <text x="10" y="70" font-family="sans-serif" font-size="12px" fill="#000000">+ renderGauge()</text>
  </g>

  <!-- ==================== RELATIONSHIP LINES (CONNECTIONS) ==================== -->

  <!-- Controller to Ensemble (Organizer to Staff) -->
  <path d="M 430 80 L 140 230" fill="none" stroke="#000000" stroke-width="1" />
  <text font-family="sans-serif" font-size="11px" fill="#000000" x="400" y="105">1</text>
  <text font-family="sans-serif" font-size="11px" fill="#000000" x="145" y="215">1</text>

  <!-- Controller to FileParser (Organizer to BreakPlan) -->
  <path d="M 520 80 L 800 230" fill="none" stroke="#000000" stroke-width="1" marker-start="url(#diamond-start)" />
  <text font-family="sans-serif" font-size="11px" fill="#000000" x="535" y="105">1</text>
  <text font-family="sans-serif" font-size="11px" fill="#000000" x="770" y="215">0..*</text>
  <text font-family="sans-serif" font-size="11px" font-style="italic" fill="#000000" x="660" y="145">parses</text>

  <!-- Ensemble to SentinelServer (Staff to Statistics) -->
  <path d="M 200 265 L 370 265" fill="none" stroke="#000000" stroke-width="1" />
  <text font-family="sans-serif" font-size="11px" fill="#000000" x="220" y="255">1</text>
  <text font-family="sans-serif" font-size="11px" fill="#000000" x="350" y="255">1</text>

  <!-- Ensemble to SentinelDB (Staff to Teacher) -->
  <path d="M 120 300 L 120 440" fill="none" stroke="#000000" stroke-width="1" marker-start="url(#diamond-start)" />
  <text font-family="sans-serif" font-size="11px" fill="#000000" x="130" y="325">1</text>
  <text font-family="sans-serif" font-size="11px" fill="#000000" x="130" y="425">0..*</text>

  <!-- FileParser to ChartRenderer (BreakPlan to Break) -->
  <path d="M 800 300 L 800 440" fill="none" stroke="#000000" stroke-width="1" marker-start="url(#diamond-start)" />
  <text font-family="sans-serif" font-size="11px" fill="#000000" x="810" y="325">1</text>
  <text font-family="sans-serif" font-size="11px" fill="#000000" x="810" y="425">0..*</text>

  <!-- SentinelDB to ChartRenderer (Teacher to Break) -->
  <path d="M 240 510 L 710 510" fill="none" stroke="#000000" stroke-width="1" />
  <text font-family="sans-serif" font-size="11px" fill="#000000" x="260" y="500">0..1</text>
  <text font-family="sans-serif" font-size="11px" fill="#000000" x="670" y="500">0..*</text>
  <text font-family="sans-serif" font-size="11px" font-style="italic" fill="#000000" text-anchor="middle" x="480" y="495">renders</text>
</svg>
